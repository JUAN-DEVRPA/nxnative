name: Build NXNative IPA (Staff Engineer Edition)

on:
  workflow_dispatch:
    inputs:
      base_nsp_url:
        description: 'URL de Google Drive del Juego Base (.nsp)'
        required: true
      update_nsp_url:
        description: '(Opcional) URL de Google Drive del Update (.nsp)'
        required: false
        default: ''
      game_lang:
        description: 'Idioma nativo preconfigurado en el .ipa'
        type: choice
        options:
          - es-419
          - es
          - en-US
        default: 'es-419'

concurrency:
  group: nxnative-ipa-builder-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ANALYTICS: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PYTHONUNBUFFERED: 1
  WORK_DIR: /Users/runner/Games/MiJuego
  KEYS_DIR: /Users/runner/keys

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: 1. Checkout del motor NXNative
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Liberación Agresiva de Disco y Auditoría Fail-Fast de Xcode
        env:
          TARGET_LANG: ${{ inputs.game_lang }}
        run: |
          set -euo pipefail
          echo "::group::Liberando espacio en el SSD del Runner"
          rm -rf /Users/runner/Library/Android &
          echo "::endgroup::"

          echo "::group::Selección de Toolchain y Parcheo AST/UI"
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "✓ Xcode activo: $LATEST_XCODE (iOS SDK $SDK_VER)"

          if ! xcodebuild -version | grep -q "Xcode 26"; then
            find dm/ios/ -name "*.swift" -exec sed -i '' \
              -e 's/\.buttonStyle(\.glassProminent)/\.buttonStyle(\.borderedProminent)/g' \
              -e 's/\.buttonStyle(\.glass)/\.buttonStyle(\.bordered)/g' \
              -e 's/\.glassProminent/\.borderedProminent/g' {} +

            find dm/ scripts/ -type f \( -name "*.yml" -o -name "*.py" -o -name "*.sh" \) \
              -exec sed -i '' \
              -e 's/iOS: "26\.0"/iOS: "18.0"/g' \
              -e 's/iOS: 26\.0/iOS: 18.0/g' \
              -e 's/IPHONEOS_DEPLOYMENT_TARGET=26\.0/IPHONEOS_DEPLOYMENT_TARGET=18.0/g' \
              -e 's/iphoneos26\.0/iphoneos18.0/g' {} +
          fi

          if [ -n "$TARGET_LANG" ]; then
            find scripts/ -name "*.py" -exec sed -i '' "s/en-US/$TARGET_LANG/g" {} + || true
          fi
          echo "::endgroup::"

          echo "::group::Preflight Fail-Fast (Typecheck de SwiftUI + Clang)"
          xcrun --sdk iphoneos swiftc -typecheck \
            -target arm64-apple-ios18.0 \
            -sdk "$SDK_PATH" \
            dm/ios/Sources/Launcher.swift
          echo "✓ Validación estática de Swift superada en 0 errores."
          echo "::endgroup::"

      - name: 3. Instalar Dependencias con Paralelismo Nativo
        run: |
          set -euo pipefail
          for pkg in xcodegen spirv-cross glslang zstd; do
            brew list "$pkg" &>/dev/null || brew install --quiet "$pkg"
          done
          which dotnet &>/dev/null || brew install --cask --quiet dotnet-sdk
          python3 -m pip install --quiet --disable-pip-version-check \
            lz4 capstone fonttools gdown "backports.zstd; python_version < '3.14'" \
            --break-system-packages

      - name: 4. Validar Criptografía (prod.keys)
        env:
          SECRET_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail
          mkdir -p "$KEYS_DIR" "$WORK_DIR"
          if [ -n "$SECRET_KEYS" ]; then
            printf "%s\n" "$SECRET_KEYS" > "$KEYS_DIR/prod.keys"
          elif [ -f "prod.keys" ]; then
            cp prod.keys "$KEYS_DIR/prod.keys"
          else
            echo "::error::Falta prod.keys (ni en Secrets ni en el repo)."
            exit 1
          fi
          tr -d '\r' < "$KEYS_DIR/prod.keys" > "$KEYS_DIR/prod.keys.clean"
          mv "$KEYS_DIR/prod.keys.clean" "$KEYS_DIR/prod.keys"

          for req_key in "header_key" "aes_kek_generation_source" "key_area_key_application_00"; do
            if ! grep -q "$req_key" "$KEYS_DIR/prod.keys"; then
              echo "::error::prod.keys corrupto o incompleto: falta '$req_key'."
              exit 1
            fi
          done
          echo "✓ Criptografía validada (formato LF limpio)."

      - name: 5. Restaurar Caché Multinivel (Shaders Metal + Binarios Rewritten)
        uses: actions/cache/restore@v4
        with:
          path: |
            /Users/runner/Games/MiJuego/*_build/shader
            /Users/runner/Games/MiJuego/*_build/rewrite
            /Users/runner/Games/MiJuego/*_build/profile
          key: nxnative-metal-v2-${{ github.run_id }}
          restore-keys: |
            nxnative-metal-v2-
            nxnative-cache-

      - name: 6. Descarga Segura de Archivos .nsp Individuales
        env:
          BASE_URL: ${{ inputs.base_nsp_url }}
          UPD_URL: ${{ inputs.update_nsp_url }}
        run: |
          set -euo pipefail
          download_file() {
            local url="$1"
            local out="$2"
            if [[ "$url" == *"drive.google.com"* ]]; then
              local file_id
              file_id=$(echo "$url" | sed -n 's/.*\/d\/\([^\/?]*\).*/\1/p')
              python3 -m gdown "${file_id:-$url}" -O "$out"
            else
              curl -fL --retry 5 --retry-delay 5 "$url" -o "$out"
            fi

            local magic
            magic=$(xxd -p -l 4 "$out")
            if [ "$magic" != "50465330" ]; then
              echo "::error::El archivo descargado ($out) no es un contenedor .nsp válido (Magic: $magic). Asegúrate de que el enlace de Google Drive sea de un archivo individual y tenga permisos públicos."
              head -c 300 "$out" || true
              exit 1
            fi
            echo "✓ Archivo verificado correctamente: $(basename "$out") ($(du -h "$out" | cut -f1))"
          }

          echo "Descargando juego base..."
          download_file "$BASE_URL" "$WORK_DIR/base_game.nsp"

          if [ -n "$UPD_URL" ]; then
            echo "Descargando actualización (update)..."
            download_file "$UPD_URL" "$WORK_DIR/update_game.nsp"
          fi

          ls -lh "$WORK_DIR"/*.nsp

      - name: 7. Recompilación AOT, Shaders Metal y Empaquetado IPA
        run: |
          set -o pipefail
          wait
          df -h
          if ! python3 scripts/build_ipa_from_nsp.py "$WORK_DIR" -k "$KEYS_DIR/prod.keys"; then
            echo "::error::Fallo en la tubería de compilación. Volcando trazas:"
            tail -n 120 "$WORK_DIR"/*_build/logs/build_ipa.log || true
            tail -n 120 "$WORK_DIR"/*_build/ipa/build/ios/pkg/build.log || true
            exit 1
          fi
          rm -f "$WORK_DIR"/*.nsp

      - name: 8. Persistir Caché de Shaders Metal (Ejecución Garantizada)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            /Users/runner/Games/MiJuego/*_build/shader
            /Users/runner/Games/MiJuego/*_build/rewrite
            /Users/runner/Games/MiJuego/*_build/profile
          key: nxnative-metal-v2-${{ github.run_id }}

      - name: 9. Publicar IPA y Generar Reporte Ejecutivo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-iPhone17-IPA
          path: /Users/runner/Games/MiJuego/*.ipa
          compression-level: 0
          retention-days: 7

      - name: 10. Resumen de Telemetría del Build
        if: always()
        run: |
          {
            echo "## 📱 Reporte de Compilación NXNative (iPhone 17)"
            if ls "$WORK_DIR"/*.ipa &>/dev/null; then
              IPA_FILE=$(ls "$WORK_DIR"/*.ipa | head -n 1)
              IPA_SIZE=$(du -h "$IPA_FILE" | cut -f1)
              IPA_SHA=$(shasum -a 256 "$IPA_FILE" | cut -d' ' -f1)
              echo "- **Estado:** ✅ Éxito Total"
              echo "- **Archivo Generado:** \`$(basename "$IPA_FILE")\`"
              echo "- **Tamaño Final:** \`$IPA_SIZE\`"
              echo "- **Idioma Preconfigurado:** \`${{ inputs.game_lang }}\`"
              echo "- **SHA-256:** \`$IPA_SHA\`"
            else
              echo "- **Estado:** ❌ Falló o fue cancelado"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
