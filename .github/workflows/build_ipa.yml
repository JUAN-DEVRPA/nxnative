name: Build NXNative IPA

on:
  workflow_dispatch:
    inputs:
      nsp_url:
        description: 'Enlace de Google Drive o descarga directa de tu juego (.nsp)'
        required: true

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de macOS
        run: |
          brew install xcodegen spirv-cross glslang
          brew install --cask dotnet-sdk
          pip3 install lz4 capstone fonttools gdown "backports.zstd; python_version < '3.14'" --break-system-packages

      - name: Preparar prod.keys
        env:
          SECRET_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/keys ~/Games/MiJuego
          if [ -n "$SECRET_KEYS" ]; then
            echo "$SECRET_KEYS" > ~/keys/prod.keys
          elif [ -f "prod.keys" ]; then
            cp prod.keys ~/keys/prod.keys
          else
            echo "Error: No se encontró prod.keys"
            exit 1
          fi

      - name: Descargar el juego (.nsp)
        run: |
          URL="${{ github.event.inputs.nsp_url }}"
          if [[ "$URL" == *"drive.google.com"* ]]; then
            # Extrae el identificador del archivo automáticamente desde el link de Drive
            DRIVE_ID=$(echo "$URL" | sed -n 's/.*\/d\/\([^\/]*\).*/\1/p')
            if [ -n "$DRIVE_ID" ]; then
              python3 -m gdown "$DRIVE_ID" -O ~/Games/MiJuego/game.nsp
            else
              python3 -m gdown "$URL" -O ~/Games/MiJuego/game.nsp
            fi
          else
            curl -L "$URL" -o ~/Games/MiJuego/game.nsp
          fi
          ls -lh ~/Games/MiJuego/

      - name: Convertir .nsp a .ipa
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/MiJuego -k ~/keys/prod.keys

      - name: Guardar el .ipa terminado
        uses: actions/upload-artifact@v4
        with:
          name: Juego-iOS-IPA
          path: ~/Games/MiJuego/*.ipa
